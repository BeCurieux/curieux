# Does Reelkit still typecheck, pass its tests, and build?
#
# No secrets and no network beyond installing packages: the importer's tests
# inject their own transport, and with no ANTHROPIC_API_KEY the ad writer runs
# on templates. A throwaway Postgres runs the credit functions for real
# (tests/db.test.ts): the rules that stop a credit being spent twice live in
# SQL, and a mock of SQL tests nothing.

name: reelkit

on:
  push:
    branches: [main]
    paths:
      - "reelkit/**"
      - ".github/workflows/reelkit.yml"
  pull_request:
    paths:
      - "reelkit/**"
      - ".github/workflows/reelkit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reelkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: reelkit

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: reelkit/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: reelkit/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
        env:
          REELKIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

      - name: Build
        run: pnpm build

# MarketFit's Shopify app configuration, for the Shopify CLI.
#
# A draft: client_id and application_url are placeholders until the app exists
# in the Partner Dashboard. `shopify app deploy` pushes this file; nothing here
# has been deployed. The name and handle are the brief's working name.

name = "MarketFit"
handle = "marketfit"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE_WITH_APP_HOST"
embedded = true

[access_scopes]
# M1 reads the catalogue only. M3's push-to-Shopify (metafields, translations)
# will add write_products and write_translations, which re-prompts the merchant.
scopes = "read_products"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update", "products/delete"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update"]
uri = "/api/shopify/webhooks"

# Mandatory for any App Store app, whether or not it holds customer data.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks"

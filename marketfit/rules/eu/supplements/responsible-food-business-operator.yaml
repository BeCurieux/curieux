kind: required_field
title: No EU food business operator name and address
fix: >-
  Name the food business operator responsible for the product in the EU and
  give their address. A business outside the EU needs an EU-based operator or
  importer under whose name the product is marketed.
severity: blocked
confidence: drafted
version: 1
params:
  facts: [responsible_person_name, responsible_person_address]
citation:
  regulation: Regulation (EU) No 1169/2011 (food information to consumers)
  url: https://eur-lex.europa.eu/eli/reg/2011/1169/oj
  effective_from: "2014-12-13"
  article: Art. 8(1) and 9(1)(h)

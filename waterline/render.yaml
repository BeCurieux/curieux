# Render blueprint for the Waterline API (Express). Deploys the backend as-is —
# `npm run server` reads $PORT, which Render provides. Point the frontend's
# VITE_API_BASE at the resulting URL to serve live data.
#
# Use: in Render → New → Blueprint → pick this repo. (rootDir scopes it to waterline/.)
services:
  - type: web
    name: waterline-api
    runtime: node
    rootDir: waterline
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: WATERLINE_DATA
        value: shopify   # serve the captured Mamacita & Crew snapshot; use "seed" for the sample store

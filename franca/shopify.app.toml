# Franca's Shopify app configuration, for the Shopify CLI.
#
# A draft: client_id and application_url are placeholders until the app exists
# in the Partner Dashboard (SHOPIFY-APP.md, "What only the owner can do").
# `shopify app deploy` pushes this file; nothing here has been deployed.

name = "Franca"
handle = "franca"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://REPLACE_WITH_APP_HOST"
embedded = true

[access_scopes]
# Products only (brief §7). Every query in src/shopify/admin/products.ts was
# validated against the Admin schema as needing read_products and nothing more.
# write_app_proxy is not data access: Shopify requires it to configure the app
# proxy below, which serves the badge from the shop's own domain.
scopes = "read_products,write_app_proxy"

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update", "products/delete"]
uri = "/api/shopify/webhooks"

[[webhooks.subscriptions]]
topics = ["app/uninstalled", "app/scopes_update"]
uri = "/api/shopify/webhooks"

# Mandatory for any App Store app, whether or not it holds customer data.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/shopify/webhooks"

# The storefront badge: /apps/franca/badge on the merchant's domain is proxied
# to the app, signed by Shopify (src/shopify/appProxy.ts).
[app_proxy]
url = "https://REPLACE_WITH_APP_HOST/api/proxy"
prefix = "apps"
subpath = "franca"
